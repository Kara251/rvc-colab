# Shared configuration for the rvc-colab pipeline.

# Pinned upstream training engine.
applio_repo: https://github.com/IAHispano/Applio.git
applio_commit: 55fe0b976a6990bb75261c32ccecf6bfca3198f1

# Google Drive root folder that holds datasets, logs, exports and cache.
drive_root: RVC-Train

# Local paths.
voice_data: F:\Dev\AI-Models\VoiceData
datasets_dir: F:\Dev\AI-Models\datasets
rvc_models_dir: F:\Dev\AI-Models\RVC

# Training defaults (per-model values in models.yaml override these).
defaults:
  sample_rate: 48000
  batch_size: 8
  save_every_epoch: 10
  f0_method: rmvpe
  embedder_model: japanese-hubert-base
  vocoder: HiFi-GAN
  gpu: "0"
  # epochs = clamp(round(target_steps * batch_size / n_files), min, max)
  target_steps: 25000
  min_epochs: 300
  max_epochs: 1200

# Colab session.
colab:
  session_name: rvc-train
  gpu: T4
  poll_seconds: 120
