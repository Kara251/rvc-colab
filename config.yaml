# Local paths and defaults for the dataset/manifest tools.
# The Colab worker reads models.yaml on Drive; this file is local-only.

voice_data: F:/Dev/AI-Models/VoiceData
datasets_dir: F:/Dev/AI-Models/datasets

defaults:
  sample_rate: 48000
  batch_size: 8
  save_every_epoch: 10
  f0_method: rmvpe
  embedder_model: japanese-hubert-base
  vocoder: HiFi-GAN
  # epochs = clamp(target_steps * batch_size / files, min, max)
  target_steps: 25000
  epochs_min: 300
  epochs_max: 1200
